<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hushbones</title>
<style>
  @font-face { font-family: Merriweather; font-weight: 900; src: url(assets/fonts/Merriweather-Black.ttf); }
  @font-face { font-family: Merriweather; font-weight: 700; src: url(assets/fonts/Merriweather-Bold.ttf); }
  @font-face { font-family: Alegreya; font-weight: 500; src: url(assets/fonts/AlegreyaSans-Medium.ttf); }
  @font-face { font-family: Alegreya; font-weight: 700; src: url(assets/fonts/AlegreyaSans-Bold.ttf); }
  :root {
    --gold: #f2c14e; --gold-dark: #8a5a14; --ink: #24140a; --cream: #f6ead0; --dim: #cdb894;
    --bad: #ff5a48; --good: #a8e07c; --purple: #c9a2ff; --hp: #c8202c; --hp-2: #ff5a4a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0c10; color: var(--cream);
    font-family: Alegreya, system-ui, sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; display: flex; justify-content: center;
    background: radial-gradient(ellipse 80% 55% at 50% 55%, #8a1c26 0%, #5c0f1c 45%, #2c0a1e 80%, #160612 100%); }
  #app::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 50% at 50% 0%, rgba(120,50,170,.3), transparent 60%),
                radial-gradient(ellipse 120% 40% at 50% 100%, rgba(0,0,0,.55), transparent 70%); }
  #app.shake { animation: shake .35s; }
  /* venue backdrop (d): barely visible tone-on-tone hint of the place, strongest at the top, gone by the table */
  #venue { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: center top / cover no-repeat;
    opacity: 0; transition: opacity 1.2s ease, background-image 0s; mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.85) 28%, rgba(0,0,0,.25) 55%, transparent 78%);
            mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.85) 28%, rgba(0,0,0,.25) 55%, transparent 78%); }
  #venue.on { opacity: .55; }
  /* per-venue palette: the Lowmarket is torchlit grey stone and brown weathered plank (d) */
  #app { transition: background 1.2s ease; }
  #app[data-venue="lowmarket"] { background: radial-gradient(ellipse 80% 55% at 50% 55%, #6a4a2c 0%, #4a3a2e 40%, #2c2622 75%, #141210 100%); }
  #app[data-venue="lowmarket"]::after { background: radial-gradient(ellipse 120% 50% at 50% 0%, rgba(255,150,60,.18), transparent 60%),
                radial-gradient(ellipse 120% 40% at 50% 100%, rgba(0,0,0,.6), transparent 70%); }
  #app[data-venue="lowmarket"] #venue.on { opacity: .8; mix-blend-mode: normal; }
  @keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 0); } }
  #stage { position: absolute; inset: 0; z-index: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  /* the wrapper carries the safe-area padding: WebKit resolves env() to 0 inside the zoomed .col */
  .colwrap { position: relative; z-index: 1; width: 100%; max-width: 560px; height: 100%; display: flex; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; pointer-events: none; }
  .col { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 6px 12px; pointer-events: none; }
  .col > * { pointer-events: auto; }
  /* percentages aren't scaled by zoom, only lengths, so width/height stay 100% and the px cap is divided by --z */
  .col { --z: .88; zoom: var(--z); }
  .spacer, .passive { pointer-events: none !important; }
  .spacer { flex: 1; }
  h2 { font-family: Merriweather, Georgia, serif; font-weight: 900; }

  .panel { border: 14px solid transparent; border-image: url(assets/ui/panel_dark.png) 40 fill / 14px stretch; }
  /* square buttons with gold edges: outer gold border, thin inner gold line, solid fill */
  .btn-gold, .btn-dark { border-radius: 2px; border: 2px solid #f2c14e; position: relative; }
  .btn-gold { color: var(--ink); background: linear-gradient(#f6d27a, #e0a63a 55%, #c98a24);
    box-shadow: inset 0 0 0 2px #7a4e10, inset 0 0 0 3px #ffe7a8, 0 3px 0 #4a2e08, 0 6px 12px rgba(0,0,0,.45); }
  .btn-dark { color: var(--cream); background: linear-gradient(#34262c, #1d1418);
    box-shadow: inset 0 0 0 2px #120b0d, inset 0 0 0 3px #b8862e, 0 3px 0 #000, 0 6px 12px rgba(0,0,0,.45); }
  .btn-gold:active:not(:disabled), .btn-dark:active:not(:disabled) { box-shadow: inset 0 0 0 2px #120b0d, inset 0 0 0 3px #b8862e; transform: translateY(2px); }
  button { font: inherit; cursor: pointer; background-color: transparent; color: inherit; }
  button:disabled { filter: saturate(.55) brightness(.6); cursor: default; }

  .top { display: flex; gap: 8px; align-items: stretch; }
  .plate { padding: 0 6px; display: flex; align-items: center; justify-content: center; font: 900 14px Merriweather; white-space: nowrap; min-height: 20px; }
  .plate.title { flex: 1; justify-content: flex-start; overflow: hidden; }
  .plate .sub { font: 500 13px Alegreya; color: var(--dim); margin-left: 6px; }
  .coins img { width: 20px; height: 20px; margin-right: 5px; }
  .help { width: 48px; font-size: 17px; color: var(--gold); }

  /* fighter plates */
  .fighter { display: flex; align-items: center; gap: 10px; padding: 0 4px 0 0; position: relative; }
  .medal { width: 64px; height: 64px; border-radius: 50%; flex: none; margin: -6px 0 -6px -6px; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .fighter.small .medal { width: 46px; height: 46px; }
  .fighter .info { flex: 1; min-width: 0; }
  .fighter .nm { font: 900 16px Merriweather; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .fighter .nm span.r { font: 700 13px Alegreya; color: var(--dim); white-space: nowrap; }
  .fighter .nm span.r.rage { color: var(--bad); font-weight: 700; }
  .pips { color: var(--gold); letter-spacing: 2px; }
  .hpbar { position: relative; height: 18px; margin-top: 4px; border-radius: 9px; background: #1a0d10; box-shadow: inset 0 0 0 2px #6b4a1a; overflow: hidden; }
  .hpbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#ff6a5a, var(--hp) 60%, #8a1018); transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .hpbar i.ghost { background: #f6ead0; opacity: .55; transition: width .9s .35s ease-out; }
  .hpbar b { position: relative; display: block; text-align: center; font: 900 12px/18px Merriweather; color: #fff; text-shadow: 0 1px 2px #000; }
  .claim { margin-top: 4px; font: 700 13px Alegreya; color: #ff9a8c; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .claim b { color: #ff5a48; font-family: Merriweather; letter-spacing: .06em; }
  .fighter.hurt { animation: hurt .4s; }
  @keyframes hurt { 0% { filter: brightness(2) saturate(2) hue-rotate(-20deg); transform: translateX(-4px); } 50% { transform: translateX(4px); } 100% { filter: none; transform: none; } }
  .curse { margin-top: 6px; padding: 1px 8px; text-align: center; font: 700 13px Alegreya; color: #f0e0ff; background: rgba(80,30,120,.6); border-radius: 10px; border: 2px solid #8a5ad0; }
  .curse[hidden] { display: none; }

  .chargeRow { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; min-height: 0; }
  .charge { font: 900 15px Merriweather; color: var(--gold); padding: 1px 10px; border-radius: 12px; background: rgba(20,8,12,.75); border: 1px solid rgba(242,193,78,.6); }
  .charge.pop { animation: pop .2s; }
  @keyframes pop { 50% { transform: scale(1.18); } }
  .chip { padding: 1px 8px; border-radius: 12px; background: rgba(20,8,12,.7); border: 1px solid rgba(242,193,78,.4); font: 700 13px Alegreya; letter-spacing: .04em; }
  .chip b { color: var(--gold); margin-left: 4px; }
  .chip.hot { background: var(--gold); color: var(--ink); } .chip.hot b { color: var(--ink); }
  .streak { text-align: center; font: 700 13px Alegreya; color: var(--bad); text-shadow: 0 1px 2px #000; }

  .tray { display: flex; align-items: center; gap: 8px; padding: 0 2px 0 8px; min-height: 30px; }
  .tray .word { flex: 1; font: 900 24px Merriweather; letter-spacing: .1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray .word.empty { font: 500 16px Alegreya; letter-spacing: 0; color: rgba(246,234,208,.5); }
  .tray .sm { padding: 0 14px; height: 40px; font: 900 15px Merriweather; }
  .tray .x { color: var(--dim); }
  .msg { min-height: 22px; margin: 4px 0; text-align: center; font: 700 15px Alegreya; color: var(--dim); text-shadow: 0 1px 2px #000; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--good); } .msg.info { color: var(--purple); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big { height: 62px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 900 18px Merriweather; padding: 0; transition: transform .08s; }
  .big:active:not(:disabled) { transform: translateY(2px) scale(.98); }
  .big img { width: 42px; height: 42px; margin-left: -6px; }
  .big small { display: block; font: 700 12px Alegreya; opacity: .8; }
  .stuck { display: block; margin: 4px auto 0; color: var(--dim); font: 500 14px Alegreya; text-decoration: underline; border: 0; padding: 2px; }
  .stuck[hidden] { display: none; }
  .bottom { display: flex; gap: 8px; margin-top: 6px; align-items: stretch; }
  .bottom .fighter { flex: 1.25; }
  .tray2 { padding: 0 4px; display: flex; align-items: center; gap: 5px; }
  .tray2 .t { font: 700 12px Merriweather; margin-right: 1px; }
  .slot { width: 36px; height: 36px; border-radius: 2px; background: #1d1418; box-shadow: inset 0 0 0 2px #5b3e1a; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .slot img { width: 30px; height: 30px; }
  .slot.empty { opacity: .45; cursor: default; }
  .slot.armed { box-shadow: inset 0 0 0 2px var(--gold), 0 0 12px var(--gold); }
  .belt { display: flex; gap: 8px; margin-top: 6px; }
  .belt .tray2 { flex: 1; overflow: hidden; }
  .belt .lore { flex: none; width: 132px; flex-direction: column; align-items: stretch; gap: 2px; justify-content: center; cursor: pointer; }
  .lore .t { display: flex; justify-content: space-between; } .lore .t b { color: var(--purple); }
  .lorebar { display: flex; gap: 2px; }
  .lorebar i { flex: 1; height: 9px; border-radius: 3px; background: #2a1a2e; box-shadow: inset 0 0 0 1px #5a3a6a; }
  .lorebar i.on { background: linear-gradient(#e2c2ff, #9a5ae0); box-shadow: 0 0 6px #b98cff; }
  .chip .lr { color: var(--purple); margin-left: 3px; }
  .lore .t img { width: 18px; height: 18px; margin-left: 1px; vertical-align: -4px; }
  .boxhead { text-align: center; margin: -4px 0 0; } .boxhead img { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .boxwrap { position: relative; width: 210px; height: 210px; margin: 0 auto; cursor: pointer; }
  .boxwrap img.box { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); }
  .boxwrap.rattle img.box { animation: rattle 1.1s ease-in-out infinite; }
  @keyframes rattle { 0%, 55%, 100% { transform: rotate(0); } 60% { transform: rotate(-7deg) translateY(-4px); } 68% { transform: rotate(6deg); } 76% { transform: rotate(-4deg) translateY(-2px); } 84% { transform: rotate(3deg); } 92% { transform: rotate(0); } }
  .boxwrap .burst { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(255,240,190,.95), rgba(255,200,80,.5) 35%, transparent 70%); opacity: 0; pointer-events: none; }
  .boxwrap.open .burst { animation: burst .7s ease-out forwards; }
  .boxwrap.open img.box { animation: lid .6s ease-in forwards; }
  @keyframes burst { 0% { opacity: 0; transform: scale(.3); } 35% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes lid { 0% { transform: scale(1); } 30% { transform: scale(1.12) rotate(-3deg); } 100% { transform: scale(.6) translateY(30px); opacity: 0; } }
  .boxwrap.crystal .burst { background: radial-gradient(circle, rgba(240,220,255,.95), rgba(170,100,255,.55) 35%, transparent 70%); }
  .reveal .offer { animation: rise .45s var(--d, 0s) cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }

  .float { position: fixed; z-index: 18; pointer-events: none; font: 900 34px Merriweather; text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 18px currentColor; animation: floatUp 1.1s ease-out forwards; white-space: nowrap; transform: translateX(-50%); }
  .float.dmg { color: var(--gold); } .float.hit { color: var(--bad); } .float.guard { color: #9ad0ff; font-size: 26px; }
  .float small { display: block; font: 900 14px Merriweather; letter-spacing: .1em; text-align: center; }
  @keyframes floatUp { 0% { opacity: 0; margin-top: 12px; scale: .7; } 15% { opacity: 1; scale: 1.15; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -40px; scale: 1; } }
  .flash { position: fixed; left: 0; right: 0; top: 40%; text-align: center; z-index: 15; pointer-events: none;
    font: 900 48px Merriweather; color: var(--gold); text-shadow: 0 4px 0 rgba(0,0,0,.5), 0 0 30px rgba(255,200,80,.8); opacity: 0; }
  .flash.neg { color: var(--bad); text-shadow: 0 4px 0 rgba(0,0,0,.5), 0 0 30px rgba(255,80,60,.8); }
  .flash.go { animation: flash 1.1s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: scale(.6); } 20% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
  .toast { position: fixed; left: 50%; top: 27%; transform: translateX(-50%); z-index: 25; width: max-content; max-width: 320px; padding: 4px 8px; text-align: center; font: 500 15px Alegreya; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .toast.on { opacity: 1; }

  .ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(18,6,12,.76); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .ov[hidden] { display: none; }
  .card { width: 100%; max-width: 420px; max-height: calc(100% - 20px); overflow: auto; padding: 8px 10px; text-align: center; }
  .card h2 { margin: 2px 0 6px; font-size: 26px; color: var(--gold); }
  .card h2.bad { color: var(--bad); }
  .card h2.logo { font-size: 36px; letter-spacing: .02em; text-shadow: 0 3px 0 rgba(0,0,0,.5); }
  .card p { margin: 8px 0; line-height: 1.4; font-size: 16px; }
  .card .small { font-size: 14px; color: var(--dim); }
  .card .big { width: 100%; margin-top: 10px; }
  .bust-portrait { display: block; margin: -4px auto 0; max-width: 78%; max-height: 210px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
  .bust-portrait.square { border-radius: 14px; max-height: 190px; box-shadow: 0 0 0 3px var(--gold-dark); }
  .quip { font: italic 700 17px Merriweather; color: var(--cream); }
  .letters { font: 900 22px Merriweather; letter-spacing: .18em; color: var(--dim); }
  .ex { color: var(--gold); font-weight: 700; }
  .red { color: var(--bad); font-weight: 700; }
  .rules { text-align: left; font-size: 15px; padding-left: 18px; } .rules li { margin: 6px 0; }
  .reward { margin: 8px auto; text-align: left; max-width: 260px; font-size: 15px; }
  .reward div { display: flex; justify-content: space-between; } .reward .tot { border-top: 1px solid #6b4a1a; margin-top: 4px; padding-top: 4px; font-weight: 700; color: var(--gold); }

  .shop .offers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 8px 0; }
  .shop .offer { min-width: 0; overflow-wrap: anywhere; }
  .offer { padding: 2px 4px; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 168px; }
  .offer img { width: 46px; height: 46px; }
  .offer .nm { font: 900 14px Merriweather; color: var(--gold); margin-top: 2px; }
  .offer .ds { font: 500 13px Alegreya; flex: 1; margin: 3px 0; line-height: 1.25; }
  .offer .kind { font: 700 11px Alegreya; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .offer button { width: 100%; height: 34px; padding: 0; font: 900 14px Merriweather; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .offer button img { width: 18px; height: 18px; }
  .offer.sold { opacity: .35; }
  .offer .rar { font: 900 10px Merriweather; letter-spacing: .1em; text-transform: uppercase; }
  .rar.common { color: #e8dcc0; }
  .offer.r-uncommon .rar, .rar.uncommon { color: #7fd27a; } .offer.r-uncommon { filter: drop-shadow(0 0 4px rgba(127,210,122,.35)); }
  .offer.r-rare .rar, .rar.rare { color: #ffcf4a; } .offer.r-rare { filter: drop-shadow(0 0 6px rgba(255,207,74,.45)); }
  .offer.r-legendary .rar, .rar.legendary { color: #c99bff; } .offer.r-legendary { filter: drop-shadow(0 0 8px rgba(185,140,255,.7)); }
  .owned { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0; }
  .owned .o { display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 4px; border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid #6b4a1a; font: 700 13px Alegreya; }
  .owned .o img { width: 22px; height: 22px; }
  .owned .o button { border: 0; color: var(--bad); font: 700 12px Alegreya; padding: 0 0 0 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .row2 .big { height: 54px; font-size: 16px; }
  .editor .dieRow { display: flex; gap: 4px; justify-content: center; margin: 5px 0; align-items: center; }
  .editor .dieRow .n { width: 18px; font: 700 12px Alegreya; color: var(--dim); }
  .ft { width: 40px; height: 40px; border-radius: 7px; background: url(assets/die_face.png) center/cover; color: var(--ink);
    font: 900 21px Merriweather; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 0 #8a6a45; }
  .ft.gild { box-shadow: 0 2px 0 #8a6a45, inset 0 0 0 3px var(--gold); background-color: #f2c14e; background-blend-mode: multiply; }
  .ft.wild { color: #5b2a86; }
  .ft:active { transform: scale(.94); }
  .ph { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a2a30, #1a0c12 75%); box-shadow: inset 0 0 0 3px var(--gold-dark), 0 2px 6px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; font: 900 22px Merriweather; color: var(--gold); }
  .ph.big { width: 150px; height: 150px; margin: 0 auto; font-size: 54px; }
  img.medal.sq { object-fit: cover; }
  .seedrow { display: flex; align-items: center; justify-content: center; gap: 6px; font: 700 14px Alegreya; color: var(--dim); }
  .seedrow input { width: 110px; padding: 6px 8px; border-radius: 8px; border: 2px solid #6b4a1a; background: #1a0d10; color: var(--gold); font: 900 16px Merriweather; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
  .seedrow button { padding: 0 12px; height: 36px; font: 900 13px Merriweather; }
  /* the map */
  .mapsheet h2 { margin-bottom: 0; }
  .mapstat { display: flex; justify-content: center; gap: 12px; font: 700 14px Alegreya; color: var(--dim); margin: 4px 0; }
  .mapstat b { color: var(--cream); }
  .mapwrap { position: relative; margin: 6px auto 0; width: 100%; max-width: 340px; }
  .mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .mapwrap line { stroke: rgba(205,184,148,.28); stroke-width: 2.2; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
  .mapwrap line.walked { stroke: var(--gold); stroke-dasharray: none; stroke-width: 3; }
  .mapwrap line.open { stroke: var(--cream); stroke-dasharray: none; stroke-width: 2.6; animation: dash 1s linear infinite; }
  .mnode { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; padding: 0; border: 0; background: #241418;
    box-shadow: 0 0 0 2px #6b4a1a, 0 3px 6px rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; }
  .mnode img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
  .mnode img.foe { width: 36px; height: 36px; }
  .mnode .ph { width: 36px; height: 36px; font-size: 14px; box-shadow: none; }
  .mnode.elite { box-shadow: 0 0 0 3px #d0402e, 0 3px 6px rgba(0,0,0,.6); }
  .mnode.boss { width: 56px; height: 56px; margin: -28px 0 0 -28px; box-shadow: 0 0 0 3px #a070ff, 0 0 16px #7a40d0; }
  .mnode.boss img, .mnode.boss .ph { width: 50px; height: 50px; }
  .mnode .tag { position: absolute; right: -6px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: #241418; box-shadow: 0 0 0 1px #6b4a1a; }
  .mnode .tag img { width: 14px; height: 14px; }

  /* ===================== UI v3 (art director pass, 2026-11-05; see tools/ui_director/DIRECTION.md) ===================== */

    box-shadow: inset 0 0 0 3px rgba(0,0,0,0), inset 0 0 0 4px rgba(90,58,12,.75), inset 0 0 0 5px rgba(255,232,170,.5), 0 2px 0 #3e2606, 0 6px 14px rgba(0,0,0,.5); }

    50% { box-shadow: 0 0 0 3px var(--rim), 0 0 0 5px rgba(20,6,14,.8), 0 0 22px 6px rgba(255,240,200,.85), 0 5px 10px rgba(30,10,20,.55); transform: scale(1.1); } }
  .mfoot { display: flex; align-items: center; gap: 10px; padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(rgba(20,8,14,.86), rgba(20,8,14,.94)); border-top: 1px solid #b8862e; }
  .mfoot .big { flex: 1; height: 50px; margin: 0; font-size: 16px; }

  .mlist { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 8px); display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; padding: 12px 14px;
    background: rgba(20,8,14,.96); border: 1px solid #b8862e; border-radius: 3px; box-shadow: 0 -6px 20px rgba(0,0,0,.5); font: 700 15px Alegreya; color: var(--cream); }
  .mlist span { display: flex; align-items: center; gap: 8px; }

  .mlist i img { width: 22px; height: 22px; }
  .mlist .lg-elite { --rim: #d0402e; } .mlist .lg-trial { --rim: #e0903a; } .mlist .lg-quiz { --rim: #6f9ad8; } .mlist .lg-unknown { --rim: #a070e0; }
  .mlist .lg-rest { --rim: #8cc46a; } .mlist .lg-shop { --rim: #d4b060; } .mlist .lg-clue { --rim: #d6d8e8; }
  .mlist .seed { grid-column: 1 / -1; justify-content: center; font-size: 13px; color: var(--dim); letter-spacing: .08em; }

  /* banked Attack shown as a pale bite on the foe's HP bar; the stake glows while a push is live */
  .hpbar i.bite { width: 0; left: 0; right: auto; opacity: 0; background: repeating-linear-gradient(-45deg, rgba(255,236,190,.95) 0 4px, rgba(255,200,120,.75) 4px 8px); transition: left .3s, width .3s, opacity .2s; }
  .hpbar i.bite.on { opacity: 1; animation: bite 1.1s ease-in-out infinite; }
  @keyframes bite { 50% { opacity: .55; } }
  .pill.stake button:disabled { opacity: .9; }
  .pill.stake i { color: var(--gold-hi); font-size: 16px; animation: stake 1s ease-in-out infinite; }
  @keyframes stake { 50% { text-shadow: 0 0 10px rgba(248,220,140,.9); } }
  /* victory verdict: the beaten foe's medallion, greyed, under an engraved VICTORY */
  .verdict { position: relative; display: flex; flex-direction: column; align-items: center; margin: 4px 0 2px; }
  .verdict .medal { width: 104px; height: 104px; margin: 0; filter: grayscale(.75) brightness(.8); box-shadow: 0 0 0 2px #c99a3e, 0 0 0 6px rgba(0,0,0,.6), 0 8px 18px rgba(0,0,0,.6); }
  .verdict .vk { margin-top: -14px; padding: 3px 18px; font: 900 15px Merriweather; letter-spacing: .32em; text-transform: uppercase; color: #24140a;
    background: linear-gradient(rgba(255,240,200,.18), rgba(0,0,0,.12)), url(assets/ui/tex_gold.jpg) center / 100% 100%, #c99a3e; border: 1px solid #f3d27c; border-radius: 2px; box-shadow: 0 3px 8px rgba(0,0,0,.6); animation: vk .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes vk { from { opacity: 0; transform: scale(1.25); } }
  /* unified house crests: one shield, one gold border, one engraved emblem each */
  img.crest { display: inline-block; width: 20px; height: 20px; object-fit: contain; vertical-align: -4px; margin-right: 5px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  img.crest.xs { width: 18px; height: 18px; vertical-align: -4px; margin-right: 3px; }
  img.crest.sm { width: 30px; height: 30px; vertical-align: -9px; }
  img.crest.mc { width: 40px; height: 40px; margin: 0 -2px 0 -4px; flex: none; }
  .house img.crest.big { width: 72px; height: 72px; margin: 2px 0 2px; vertical-align: 0; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  .house { filter: none !important; }
  .bagHouse b { color: var(--cream); }
  @media (prefers-reduced-motion: reduce) { .verdict .vk, .hpbar i.bite.on, .pill.stake i, .mapsheet .mnode.reach, .ringTime.low, .ov:not([hidden]) .card, .mapwrap line.open { animation: none; } }
  /* ===================== UI v4: Forms duel HUD (2026-11-06). Targets up top, Chips x Mult plate above the tray ===================== */
  /* the foe's words as targets */
  .targets { margin-top: 8px; }
  .tgh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; font: 700 13px Alegreya; color: var(--dim); }
  .tgh .lbl { text-transform: uppercase; letter-spacing: .14em; color: var(--gold); cursor: pointer; }
  .tgh .lbl::after { content: " \203A"; color: var(--dim); }
  #incoming { font: 700 14px Alegreya; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #incoming b { font: 900 15px Merriweather; } #incoming .ls { color: var(--hp-2); } #incoming .ok { color: var(--good); }
  .tgrow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
  .tcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; min-height: 70px; padding: 9px 4px 6px; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(184,134,46,.55); color: var(--cream); background: linear-gradient(rgba(255,255,255,.03), rgba(0,0,0,.25)), var(--ink-1);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,0), inset 0 0 0 4px rgba(184,134,46,.16), 0 3px 8px rgba(0,0,0,.45); transition: transform .15s, box-shadow .15s, opacity .2s; }
  .tcard .tk { position: absolute; left: 6px; right: 6px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--hp-2); }
  .tcard.block .tk, .tcard.guard .tk { background: var(--ward); } .tcard.mend .tk { background: var(--good); } .tcard.hush .tk { background: var(--hex); }
  .tcard .tw { max-width: 100%; font: 900 16px Merriweather; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard .ta { font: 900 19px/1.05 Merriweather; color: var(--hp-2); font-variant-numeric: tabular-nums; }
  .tcard.block .ta, .tcard.guard .ta { color: var(--ward); } .tcard.mend .ta { color: var(--good); } .tcard.hush .ta { color: var(--hex); font-size: 15px; }
  .tcard .ta s { color: var(--dim); font-size: 13px; margin-right: 3px; }
  .tcard em { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); padding: 0 5px; border-radius: 2px; border: 1px solid rgba(185,140,255,.7); background: var(--ink-1); font: 700 11px/14px Alegreya; font-style: normal; text-transform: uppercase; letter-spacing: .08em; color: var(--hex); }
  .tcard .tr { margin-top: 3px; padding-top: 3px; width: 100%; border-top: 1px dashed rgba(184,134,46,.35); font: italic 700 13px/1.15 Alegreya; color: var(--gold-hi); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tcard.trial .tw { font-size: 22px; color: var(--gold); }
  .tcard.fits { border-color: #f3d27c; transform: translateY(-2px); animation: fits 1.1s ease-in-out infinite;
    background: radial-gradient(120% 90% at 50% 0%, rgba(248,220,140,.18), transparent 70%), linear-gradient(rgba(255,255,255,.03), rgba(0,0,0,.25)), var(--ink-1); }
  @keyframes fits { 50% { box-shadow: inset 0 0 0 4px rgba(248,220,140,.35), 0 0 18px rgba(248,220,140,.55), 0 3px 8px rgba(0,0,0,.45); } }
  .tcard .tbreak { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); padding: 1px 8px; white-space: nowrap; border-radius: 2px; font: 900 11px Merriweather; letter-spacing: .08em; text-transform: uppercase;
    color: #24140a; background: url(assets/ui/tex_gold.jpg) center / 100% 100%, #c99a3e; border: 1px solid #f3d27c; box-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .tcard.broken { opacity: .6; border-style: dashed; }
  .tcard.broken .tw { text-decoration: line-through; text-decoration-color: var(--good); text-decoration-thickness: 2px; }
  .tcard.broken .ta { color: var(--good); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
  .tcard.frayable { box-shadow: inset 0 0 0 1px var(--good), 0 3px 8px rgba(0,0,0,.45); }
  .tcard:active { transform: scale(.97); }
  i.shd { display: inline-block; width: 11px; height: 13px; margin-right: 3px; vertical-align: -1px; background: var(--ward); clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); }
  .guardT { font-size: 15px; } .guardT i.shd { background: var(--ward); }

  /* Chips x Mult: the hero number, just above the word tray */
  .scoreplate { margin: 4px 0 6px; padding: 6px 8px 5px; border-radius: 4px; border: 1px solid rgba(184,134,46,.6);
    background: radial-gradient(80% 120% at 50% 0%, rgba(248,220,140,.08), transparent 70%), rgba(14,5,10,.82); box-shadow: inset 0 0 0 3px rgba(0,0,0,0), inset 0 0 0 4px rgba(184,134,46,.18), 0 4px 12px rgba(0,0,0,.45); }
  .scoreplate[hidden] { display: none; }
  .sp-main { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .sp-main > i { font: 900 20px Merriweather; color: var(--gold); font-style: normal; }
  .sp-box { min-width: 76px; padding: 2px 10px 1px; border-radius: 4px; text-align: center; line-height: 1; }
  .sp-box b, .sp-total b { display: block; font: 900 27px/1.05 Merriweather; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
  .sp-box span, .sp-total span { font: 700 12px Alegreya; text-transform: uppercase; letter-spacing: .14em; color: rgba(243,230,204,.85); }
  .sp-box.chp { background: linear-gradient(#1f4478, #0e1f40); box-shadow: inset 0 0 0 1px rgba(143,196,244,.55); }
  .sp-box.mult { background: linear-gradient(#8a1c26, #4a0a12); box-shadow: inset 0 0 0 1px rgba(255,120,100,.5); }
  .sp-total { min-width: 92px; text-align: center; line-height: 1; }
  .sp-total b { font-size: 34px; color: var(--gold-hi); text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 16px rgba(248,220,140,.35); }
  .scoreplate.lethal .sp-total b { color: #b8f08c; text-shadow: 0 2px 0 rgba(0,0,0,.5), 0 0 18px rgba(160,240,120,.55); }
  .scoreplate.lethal .sp-total span { color: #b8f08c; }
  .scoreplate.empty .sp-box, .scoreplate.empty .sp-total { opacity: .5; }
  .sp-box b.pop, .sp-total b.pop { animation: spop .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes spop { 0% { transform: scale(1); } 30% { transform: scale(1.28); filter: brightness(1.4); } 100% { transform: scale(1); } }
  .sp-forms { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 5px; min-height: 22px; }
  .fm { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 2px; font: 700 13px Alegreya; color: var(--cream); border: 1px solid rgba(184,134,46,.45); }
  .fm b { font: 900 12px Merriweather; color: var(--gold-hi); }
  .fm.on { color: #24140a; background: url(assets/ui/tex_gold.jpg) center / 100% 100%, #c99a3e; border-color: #f3d27c; } .fm.on b { color: #5a1a10; }
  .fm.chain { border-color: rgba(185,140,255,.7); color: #e8d8ff; background: rgba(90,50,140,.45); } .fm.chain b { color: #fff; }
  .fm.new { border-style: dashed; border-color: #f3d27c; color: var(--gold-hi); animation: fnew 1s ease-in-out infinite; }
  @keyframes fnew { 50% { background: rgba(248,220,140,.18); } }
  .fm.hint { border: 0; font: italic 600 13px Alegreya; color: var(--dim); }

  /* the word in the tray: what new Forms it would fill */
  .val2 .nf { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
  .val2 .nf b { display: inline-block; margin-left: 3px; padding: 0 5px; font: 900 13px Merriweather; color: #24140a; background: var(--gold); border-radius: 2px; }
  .val2 .nf span { font: 700 13px Alegreya; color: var(--gold-hi); }
  .val2 .nf.none span { color: var(--dim); }

  /* Hit and Break: two clear choices */
  .pill button { gap: 1px; }
  .pill .lb { font: 900 14px Alegreya; letter-spacing: .16em; text-transform: uppercase; }
  .pill b { font-size: 26px; }
  .pill i { font: italic 700 12px Merriweather; color: rgba(243,230,204,.8); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
  .pill .def:not(:disabled) { background: radial-gradient(120% 80% at 50% 0%, rgba(248,220,140,.2), transparent 60%), linear-gradient(#1d3a6a, #0d1b38); box-shadow: inset 0 0 0 2px rgba(248,220,140,.55); }
  .pill .def:not(:disabled) .lb { color: #fff1c8; }

  /* Roll: the Chain meter lives on the button */
  .rollbig { flex-direction: column; gap: 0; line-height: 1.05; }
  .rollbig .die { display: none; }
  #rollLbl { display: flex; flex-direction: column; align-items: center; }
  .chainpips { display: flex; gap: 6px; margin: 4px 0 3px; }
  .chainpips i { width: 10px; height: 10px; transform: rotate(45deg); border: 1.5px solid rgba(60,30,6,.75); background: rgba(60,30,6,.15); }
  .chainpips i.on { background: #5a1a10; border-color: #5a1a10; box-shadow: 0 0 6px rgba(255,200,120,.8); }
  .chainpips i.next { animation: pip 1s ease-in-out infinite; }
  @keyframes pip { 50% { background: rgba(90,26,16,.55); } }
  .rollbig:disabled .chainpips i { border-color: rgba(184,134,46,.45); background: transparent; }
  .rollbig:disabled .chainpips i.on { background: var(--gold); border-color: var(--gold); box-shadow: none; }

  /* slimmer player strip so the dice keep their room */
  .pstrip { margin-bottom: 4px; }
  .pstrip .pm, .pstrip .ph { width: 44px; height: 44px; }
  .pstrip .hpbar.big { height: 22px; } .pstrip .hpbar.big b { line-height: 22px; font-size: 14px; }
  .enemy { margin-top: 6px; } .enemy .medal { width: 70px; height: 70px; }
  .castsq.ready { border-color: #f3d27c; color: var(--gold-hi); animation: castready 1.2s ease-in-out infinite; }
  .castsq.ready small { color: #b8f08c; }
  @keyframes castready { 50% { box-shadow: inset 0 0 0 4px rgba(248,220,140,.4), 0 0 16px rgba(248,220,140,.55); } }
  .coach { position: absolute; left: 10px; right: 10px; top: auto; bottom: 4px; margin: 0; }   /* d: floats over the felt; in the flow it shrank the dice band, so the board zoomed when it went away */
  .coach[hidden] { display: none; }
  #app.pushing .toastline { top: 50px; }   /* below the timer plaque */
  @media (prefers-reduced-motion: reduce) { .castsq.ready, .tcard.fits, .fm.new, .chainpips i.next, .sp-box b.pop, .sp-total b.pop { animation: none; } }
  /* ===== UI v4.1: one Submit button; the word's length decides its job (d) ===== */
  .pill { grid-template-columns: 1fr; }
  .pill .submit { border-right: 0 !important; transition: background .2s; }
  .pill .submit .lb { color: var(--gold-hi); }
  .pill .submit b { font-size: 27px; }
  .pill .submit i { font: italic 700 13px Merriweather; }
  .pill .submit.r-hit:not(:disabled) { background: radial-gradient(120% 80% at 50% 0%, rgba(255,120,100,.2), transparent 60%), linear-gradient(#7c1a22, #4a0a12); }
  .pill .submit.r-break:not(:disabled) { background: radial-gradient(120% 80% at 50% 0%, rgba(248,220,140,.28), transparent 60%), linear-gradient(#5a3a10, #2c1a06); box-shadow: inset 0 0 0 2px rgba(248,220,140,.6); }
  .pill .submit.r-halve:not(:disabled), .pill .submit.r-cancel:not(:disabled) { background: radial-gradient(120% 80% at 50% 0%, rgba(140,190,255,.2), transparent 60%), linear-gradient(#1d3a6a, #0d1b38); box-shadow: inset 0 0 0 2px rgba(143,196,244,.55); }
  .pill .submit.r-halve b, .pill .submit.r-cancel b { color: var(--ward); }
  .pill .submit.r-break b { color: var(--gold-hi); }
  /* the card the word will affect */
  .tcard.aim { transform: translateY(-3px); border-color: #f3d27c; box-shadow: inset 0 0 0 4px rgba(248,220,140,.4), 0 0 18px rgba(248,220,140,.55), 0 3px 8px rgba(0,0,0,.45); }
  .tcard.aim.halve, .tcard.aim.cancel { border-color: var(--ward); box-shadow: inset 0 0 0 4px rgba(143,196,244,.35), 0 0 18px rgba(143,196,244,.55), 0 3px 8px rgba(0,0,0,.45); }
  .tcard.aim.halve .tbreak, .tcard.aim.cancel .tbreak { color: #0d1b38; background: linear-gradient(#cfe6ff, #8fc4f4); border-color: #e2f0ff; }
  .tcard.aim.cancel .ta { text-decoration: line-through; text-decoration-color: var(--ward); text-decoration-thickness: 2px; }
  .tcard .tbreak { text-transform: none; letter-spacing: .02em; font-size: 12px; }
  .tcard.fits { animation: none; transform: none; border-color: rgba(248,220,140,.75); box-shadow: inset 0 0 0 4px rgba(248,220,140,.14), 0 3px 8px rgba(0,0,0,.45); }
  .tcard.picked::after { content: ""; position: absolute; top: -6px; left: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 0 2px var(--ink-1), 0 0 8px var(--gold-hi); }
  .tcard em.hv { border-color: var(--ward); color: var(--ward); }
  .tcard { min-height: 60px; justify-content: center; }
  /* the foe itself when a long word will hit it */
  .enemy { border-radius: 6px; transition: box-shadow .2s, background .2s; cursor: pointer; }
  .enemy.aim { background: radial-gradient(80% 120% at 20% 50%, rgba(255,90,72,.16), transparent 70%); box-shadow: 0 0 0 1px rgba(255,120,100,.45); }
  .enemy.aim .medal { box-shadow: 0 0 0 3px var(--hp-2), 0 0 16px rgba(255,90,72,.6) !important; }
  .enemy.picked .medal { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 18px var(--gold-hi) !important; }
  /* big foe words (a long word at x2): heavier crimson stripe and edge, a BIG tab, two columns wide when there's room */
  .tcard.big { border-color: rgba(255,90,72,.75); background: radial-gradient(120% 90% at 50% 0%, rgba(255,90,72,.16), transparent 70%), linear-gradient(rgba(255,255,255,.03), rgba(0,0,0,.25)), var(--ink-1); }
  .tcard.big .tk { height: 5px; left: 0; right: 0; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #ff5a48, #ffb04a, #ff5a48); }
  .tcard.big .ta { font-size: 23px; text-shadow: 0 0 10px rgba(255,90,72,.5); }
  .tcard.big.wide { grid-column: span 2; }
  .tcard.big.wide .tw { font-size: 17px !important; letter-spacing: .08em !important; }
  .tcard em.bg { color: #fff1e0; border-color: #ff7a5a; background: linear-gradient(#a8241c, #6a0e10); font-weight: 900; }
  .tcard.big.broken { border-color: rgba(184,134,46,.55); background: var(--ink-1); }
  .tcard.big.broken .tk { height: 3px; background: var(--hp-2); }
  /* ===== playtest batch (2026-11-06) ===== */
  #blocker { position: fixed; inset: 0; z-index: 19; background: transparent; }
  #blocker[hidden] { display: none; }
  .reveal .offer { animation-duration: .3s; grid-template-columns: 50px 1fr 72px; column-gap: 10px; }
  .reveal .offer img { width: 48px; height: 48px; }
  .reveal .offer .kind { white-space: normal; line-height: 1.2; }   /* playtest: a nowrap kind line ("CHARM · COMMON · PROF. QUELL") pushed Take off-screen */
  .fm.base { border-style: dashed; color: var(--dim); } .fm.base b { color: var(--cream); }
  .fm.red { border-color: rgba(255,107,87,.7); color: #ffd8d0; background: rgba(140,30,24,.45); } .fm.red b { color: #fff; }
  .sp-forms .pl { font: 900 13px Merriweather; color: var(--gold); font-style: normal; align-self: center; }
  .sp-forms .eq { font: 900 13px Merriweather; color: var(--gold-hi); font-style: normal; align-self: center; margin-left: 2px; white-space: nowrap; }
  .sp-prev { height: 20px; line-height: 20px; margin-bottom: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: center; font: 700 13px Alegreya; color: var(--dim); opacity: 0; transition: opacity .15s; }   /* always holds its row: no clipping or layout jump */
  .sp-prev.on { opacity: 1; }
  .sp-prev b { font: 900 13px Merriweather; color: var(--cream); } .sp-prev b.t { color: var(--gold-hi); } .sp-prev span { color: #b8f08c; font-weight: 700; }
  #incoming { white-space: normal; text-align: right; font-size: 13px; line-height: 1.2; }
  .ringTime small { display: block; margin-top: -2px; font: italic 700 11px Alegreya; color: var(--dim); text-align: center; }
  #app.timed .toastline { top: 58px; }
  .mnode .mlabel { top: calc(100% - 7px); z-index: 3; padding: 0 7px; border-radius: 2px; border: 1px solid rgba(184,134,46,.7); background: rgba(20,8,14,.92); font-size: 12px; line-height: 15px; }   /* a nameplate on the node's own rim: clear of its icon and of the row below */
  .mapsheet .mnode:has(.mlabel) img, .mapsheet .mnode:has(.mlabel) .qmark { margin-top: -9px; }   /* lift the icon so the nameplate never covers it */

<body>
<div id="app">

// ---------- events ----------
$("sparkBtn").onclick = submitWord;
$("clearBtn").onclick = () => { sel = []; aimPick = null; render(); };
$("rollBtn").onclick = doPush;
$("castBtn").onclick = doCast;
$("threat").onclick = e => {
  const G = g(); if (!G || G.trial) return;
  if (e.target.closest("[data-detail]")) return showIntentDetail();
  const card = e.target.closest(".tcard"); if (!card) return;
  const i = +card.dataset.fray, r = G.intent[i], isSlot = card.dataset.slot != null;
  if (isSlot && sel.length) {
    if (!legalTargets(G).includes(i)) return setMsg(r.broken ? "That word is already stopped." : sel.length <= 3 ? (sel.length === 2 && r.halved ? "That word is already halved." : "Pick one of their attack words.") : "Words of 4+ letters always hit the foe; 2–3 letter words stop their words.", "info");
    aimPick = aimPick === i ? null : i; SFX.play("click", { vol: .5 }); return render();
  }
  if (card.classList.contains("frayable") && G.frayLeft > 0 && LF.fray(G, i).ok) { play("die_3"); setMsg("Fray: that word is weakened by " + C.frayAmount + ".", "info"); return render(); }
  if (isSlot) return setMsg(r.broken ? "That word is already stopped." : `${r.word}: a 2-letter word halves it, a 3-letter word cancels it.`, "info");
  showIntentDetail();
};
function showIntentDetail() {
  const G = g(), e = G.enemy;
  if (!beforeRules) beforeRules = $("ov").hidden ? "" : $("card").innerHTML;
  showOverlay(`<h2>What ${e.name} casts next</h2>
    <div class="log">${G.intent.map(r => `<div><span><b>${r.word}</b> \u2014 ${r.kind === "attack" ? "damage" : r.kind === "block" ? "blocks your Attack this round" : r.kind === "guard" ? "Guard next round" : r.kind === "mend" ? "heals itself" : r.kind === "hush" ? "silences one of your dice next round" : "damage"}${r.leech ? " \u00B7 leech (heals half the HP it takes)" : ""}${r.thorns ? " \u00B7 thorns (reflects " + r.thorns + " if you cast damage)" : ""}${r.frayed ? " \u00B7 frayed" : ""}</span><span>${r.kind === "hush" ? "" : fmt(r.amount)}</span></div>`).join("")}</div>
    ${e.trait ? `<p class="small"><span class="trait">${LF.TRAITS[e.trait].name}:</span> ${LF.TRAITS[e.trait].desc}</p>` : ""}
    <p class="small" style="${C.omens.enabled ? "" : "display:none"}">Marked dice: gold letter = triple value · coin = +${C.omens.coin} coins · green cross = heal ${C.omens.mend} · skull = −${C.omens.cursed} HP · ½ = word worth half · blood drop = ${Math.round(C.omens.leechPct * 100)}% of your HP drains to the foe.</p>
    <p class="small">⚠ = heavy blow (double damage, every third round) · ✴ = thorns (hits you back when you attack) · ♦ = leech (heals it). Your Defense is used up row by row, top to bottom.</p>
    <p class="small">Enrages after round ${e.turns}; then its words grow \u00D7${C.enrageGrowth} each round (up to \u00D7${C.enrageCap}).${G.frayLeft > 0 ? " You can Fray one attack word: tap its chip." : ""}</p>
    <button class="big btn-dark" data-act="close">Back</button>`);
}
function soundRow() {
  const S = SFX.getSettings();
  return `<div class="soundRow"><button class="btn-dark" data-act="mute">${S.muted ? "Sound: off" : "Sound: on"}</button>
    <label>Effects <input type="range" min="0" max="1" step="0.05" value="${S.sfx}" data-snd="sfx"></label>
    ${S.ambience ? `<label>Ambience <input type="range" min="0" max="1" step="0.05" value="${S.amb}" data-snd="amb"></label>` : ""}
    ${window.HB_NATIVE ? `<button class="btn-dark" data-act="haptics">${window.HB_HAPTICS_ON !== false ? "Haptics: on" : "Haptics: off"}</button>` : ""}</div>`;
}
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.snd; if (k) SFX.setSetting(k, +e.target.value); });
$("menuBtn").onclick = () => {
  if (!run) return; if (!beforeRules) beforeRules = $("ov").hidden ? "" : $("card").innerHTML;

  showOverlay(`<div class="menuList"><h2>Menu</h2>
    ${run.map && run.state !== "house" ? `<button class="big btn-dark" data-act="viewmap">The map</button>` : ""}
    <button class="big btn-dark" data-act="rules">How to play</button>
    <button class="big btn-dark" data-act="board">Leaderboard</button>
    ${run.house && run.state !== "won" && run.state !== "lost" ? `<button class="big btn-dark" data-act="savequit">Save and quit</button>` : ""}
    <button class="big btn-dark" data-act="casebook">Casebook</button>
    ${soundRow()}
    <button class="big btn-dark" data-act="close">Back</button></div>`);
};
$("bagBtn").onclick = () => {
  if (!run) return; SFX.play("bag"); SFX.play("click", { vol: .6, rate: .85 }); if (!beforeRules) beforeRules = $("ov").hidden ? "" : $("card").innerHTML;
  showOverlay(`<h2>Your bag</h2>
    ${(run.relics || []).length ? `<div class="bagSec"><h3>Relics</h3>${run.relics.map(k => `<div class="bagRow"><img src="${icon(LF.RELICS[k].icon)}" alt=""><div><b>${LF.RELICS[k].name}</b><br>${LF.RELICS[k].desc}</div></div>`).join("")}</div>` : ""}
    <div class="bagSec"><h3>Charms ${run.charms.length}/${LF.maxCharms(run)}</h3>${run.charms.length ? run.charms.map(c => `<div class="bagRow"><img src="${icon(LF.CHARMS[c].icon)}" alt=""><div><b>${LF.CHARMS[c].name}</b> <span class="small">\u00B7 ${LF.CHARMS[c].duo ? "Duo" : "Prof. " + LF.PATRONS[LF.CHARMS[c].patron].name}</span><br>${LF.CHARMS[c].desc}</div></div>`).join("") : `<p class="small">None yet.</p>`}</div>
    <div class="bagSec"><h3>Sigils ${run.sigils.length}/${C.maxSigils}</h3>${run.sigils.length ? run.sigils.map(sg => `<div class="bagRow"><img src="${icon(LF.SIGILS[sg].icon)}" alt=""><div><b>${LF.SIGILS[sg].name}</b><br>${LF.SIGILS[sg].desc}</div></div>`).join("") : `<p class="small">None yet.</p>`}</div>
    <p class="small bagHouse">${run.house ? crestImg(run.house, "crest sm") + "<b>" + C.houses[run.house].name + "</b>: " + C.houses[run.house].desc : ""} \u00B7 Seed ${run.seed}</p>
    <button class="big btn-dark" data-act="viewdice">Your dice</button>
    <button class="big btn-dark" data-act="close">Back</button>`);
};
let beforeRules = null;


$("sigils").onclick = e => { const s = e.target.closest("[data-sigil]"); if (s) return useSigil(+s.dataset.sigil); const a = e.target.closest("[data-ability]"); if (a) useAbility(a.dataset.ability); };
$("enemyPlate").onclick = () => { const G = g(); if (!G || G.trial) return;
const e = G.enemy, tr = e.trait && LF.TRAITS[e.trait]; toast(`${e.name}: enrages after ${e.turns} rounds.` + (tr ? ` ${tr.name}: ${tr.desc}` : "")); };
$("lore").onclick = () => 0 && toast(`Lore: once per duel each, cast a 6+ letter word, cast 3+ words in a turn, cast an All Speak turn, or fully block an attack with Defense. Every ${C.lorePerCache} earns a bonus pick.`);
$("charms").onclick = e => { const c = e.target.closest("[data-charm]"); if (c) { const ch = LF.CHARMS[c.dataset.charm]; toast(ch.name + ": " + ch.desc); } };
$("card").addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return; e.preventDefault();
  const a = t.dataset.act;
  if (a === "continuerun") continueRun();
  else if ((a === "start" || a === "quickstart") && !getMeta().tutorialDone) startTutorialUI(a);   // first run: practice first
  else if (a === "tutorial") startTutorialUI(null);
  else if (a === "tutorskip") { const m = getMeta(); m.tutorialDone = true; saveMeta(m); leaveTutorial(tutorAfter === "start" ? 0 : tutorAfter === "quickstart" ? 1 : null); }
  else if (a === "tutordone") leaveTutorial(+t.dataset.q);
  else if (a === "start" || a === "quickstart") {
    clearSave();
    const v = ($("seedIn") && $("seedIn").value || "").trim().toUpperCase(); if ((v && v !== run.seed) || run.difficulty !== difficulty ) run = LF.newRun(v || run.seed, null, difficulty, metaRunOpts());
    quickStory = a === "quickstart"; run.skipStory = quickStory;
    if (a === "quickstart") showHousePick(); else playScene(window.STORY.LORE.concat(window.STORY.INTRO), showHousePick);
  }
  else if (a === "house") { LF.setHouse(run, t.dataset.h); SFX.play("click"); if (quickStory) beginAct(); else playScene(window.STORY.CHOSEN, beginAct); }
  else if (a === "scene-next") nextLine();
  else if (a === "openmenu") $("menuBtn").onclick();
  else if (a === "trialgo") startTrialClock();
  else if (a === "retry") { LF.retryRoom(run); fightIntro(`<b style="color:var(--bad)">Strike ${C.strikes - run.strikes} of ${C.strikes}.</b> Round two.`); }
  else if (a === "fizzleok") { hideOverlay(); const out = pendingTurn; pendingTurn = null; resolveTurn(out, true); }
  else if (a === "takereward") takeRewardUI(+t.dataset.i);
  else if (a === "skipreward") { LF.skipReward(run); SFX.payout(5); afterFight(); }
  else if (a === "haptics") { window.HB_HAPTICS_ON = window.HB_HAPTICS_ON === false; try { localStorage.setItem("hb_haptics", JSON.stringify(window.HB_HAPTICS_ON)); } catch (e) {} t.textContent = window.HB_HAPTICS_ON ? "Haptics: on" : "Haptics: off"; if (window.HB_HAPTICS_ON) window.HB_HAPTIC("medium"); }
  else if (a === "mute") { SFX.setSetting("muted", !SFX.getSettings().muted); t.textContent = SFX.getSettings().muted ? "Sound: off" : "Sound: on"; if (!SFX.getSettings().muted) SFX.play("click"); }
  else if (a === "replacecharm") { const i = replaceFor; replaceFor = null; const r = LF.takeReward(run, i, null, null, t.dataset.id); if (r.ok) { SFX.play("click"); afterFight(); } else toast(r.error || "Can't."); }
  else if (a === "cancelreplace") { replaceFor = null; showRewardCards(); }
  else if (a === "quizgo") showQuestion();
  else if (a === "quizpick") quizPick(t.dataset.w);
  else if (a === "reseed") { $("seedIn").value = LF.randomSeed(); }
  else if (a === "difficulty") { difficulty = t.dataset.d; try { localStorage.setItem("cw_difficulty", difficulty); } catch (e) {} $("diffBox").innerHTML = diffRow(); }
  else if (a === "room") enterRoom(t.dataset.k);
  else if (a === "lockednode") { toast("Choose a highlighted room connected to where you are."); SFX.play("tick", { rate: .7 }); }
  else if (a === "continue") afterFight();
  else if (a === "leaveroom") { LF.leaveRoom(run); afterFight(); }
  else if (a === "skiproom") { stopPushClock(); LF.skipRoom(run); D3.clearTable(); autosave(); afterFight(); }
  else if (a === "restheal") { LF.restHeal(run); SFX.play("click"); showMap(); }
  else if (a === "reststeel") { LF.restSteel(run); SFX.play("click"); showMap(); }
  else if (a === "restfeast") { if (LF.restFeast(run)) { SFX.payout(4, 0); SFX.play("click"); showMap(); } }
  else if (a === "restcarve") { restLetter = t.dataset.l; showOverlay(editorHTML({ kind: "carve", letter: restLetter })); }
  else if (a === "sameseed") newRun(run.seed);
  else if (a === "rollmode") { rollMode = t.dataset.m; try { localStorage.setItem("cw_rolls", rollMode); } catch (e) {} D3.setRollMode(rollMode); showOverlay(rulesHTML()); }
  else if (a === "play") {
    hideOverlay(); const G = g(); if (G && !G.trial) newRoundFx(); else render();
    if (G && !G.trial && run.world === "thin") setTimeout(() => {   // Thin Lacquer: once per duel the dice whisper a long word
      const w = LF.longestLegal(G); if (w && w.length >= 5) { setMsg(`Your dice whisper: ${w.toUpperCase().split("").map((c, i) => i % 2 ? "_" : c).join(" ")}`, "info"); SFX.play("reveal", { vol: .5 }); }
    }, 1400);
  }
  else if (a === "close") { const b = beforeRules; beforeRules = null; if (b && b.includes('class="mapsheet"')) showMap(); else if (b) showOverlay(b); else { hideOverlay(); render(); } }
  else if (a === "openbox") openBox();
  else if (a === "buy") tryBuy(+t.dataset.i);
  else if (a === "sell") { LF.sellCharm(run, t.dataset.id); openShop(); }
  else if (a === "inkvowel") { const G = g(), id = +t.dataset.id, v = t.dataset.v; hideOverlay(); if (G && LF.useSigilOn(G, id, v).ok) { D3.overrideTop(id, v); setMsg(`Ink: that die now shows ${v.toUpperCase()}.`, "info"); sel = sel.filter(x => x !== id); } render(); }
  else if (a === "inkcancel") { const G = g(); if (G) G.armed = null; hideOverlay(); setMsg(""); render(); }
  else if (a === "reroll") { LF.rerollShop(run); openShop(); }
  else if (a === "leave") { LF.leaveShop(run); showMap(); }
  else if (a === "viewdice") showOverlay(editorHTML(null));
  else if (a === "viewmap") { if (run.state === "map") { beforeRules = null; showMap(); } else showMap(true); }
  else if (a === "rules") showOverlay(rulesHTML());
  else if (a === "closedice" || a === "cancelpick") { if (restLetter) { restLetter = null; showRest(); } else if (beforeRules) { const b = beforeRules; beforeRules = null; showOverlay(b); } else if (pendingReward != null) { pendingReward = null; showRewardCards(); }
    else if (pendingBuy != null && run.shop) { pendingBuy = null; openShop(); }
    else if (run.state === "fight" || run.state === "trial") { hideOverlay(); render(); }   // d: Back out of Your dice mid-duel (it fell through to the shop and stuck)
    else if (run.state === "reward" && run.reward) showRewardCards();
    else if (run.state === "shop" && run.shop) openShop();
    else if (run.state === "rest") showRest();
    else showMap(); }
  else if (a === "pickface") pickFace(+t.dataset.d, +t.dataset.f);
  else if (a === "newrun") { beforeRules = null; clearSave(); newRun(); }
  else if (a === "savequit") { autosave(); beforeRules = null; stopPushClock(); newRun(); }
  else if (a === "board") {
    SFX.play("flick");
    showOverlay(`<h2>Leaderboard</h2><p class="small">Your ten best runs on this device. Score: damage dealt, +250 a duel, +1,000 an act, +3,000 Sealed or +2,000 Woken, +25 a letter of your longest word; Normal ×1.5, Hard ×2.</p>
      ${boardHTML(getBoard(), -1)}<button class="big btn-dark" data-act="${run && run.house ? "close" : "boardback"}">Back</button>`);
  }
  else if (a === "boardback") newRun(run.seed);
  else if (a === "casebook") { SFX.play("flick"); showOverlay(casebookHTML()); }
  else if (a === "echoes") { SFX.play("click"); showOverlay(echoesHTML()); }
  else if (a === "buyunlock") {
    const m = getMeta(), U = UNLOCKS[t.dataset.k];
    if (!U || m.unlocks[t.dataset.k]) return; if (m.echoes < U.cost) return toast("Not enough Echoes.");
    m.echoes -= U.cost; m.unlocks[t.dataset.k] = true; if (U.finish) m.finish = U.finish; saveMeta(m);
    SFX.payout(4); if (U.finish) D3.setFinish && D3.setFinish(m.finish); showOverlay(echoesHTML());
  }
  else if (a === "finish") { const m = getMeta(); m.finish = t.dataset.k; saveMeta(m); D3.setFinish && D3.setFinish(m.finish); SFX.play("click"); showOverlay(echoesHTML()); }
  else if (a === "secret") { const m = getMeta(); m.casebook.endings.secret = true; saveMeta(m); SFX.reveal("legendary"); playScene(window.STORY.SECRET, () => afterEnding && afterEnding()); }
  else if (a === "nosecret") { afterEnding && afterEnding(); }
  else if (a === "bones") {   // the last choice: with Sealed/Woken it sets next year's world (Lore Bible: Year Two)
    const m = getMeta(); m.years += 1; m.ending = run.woken ? "woken" : "sealed"; m.bones = t.dataset.k; m.lastTraitor = run.traitor; saveMeta(m);
    SFX.play(t.dataset.k === "give" ? "thud" : "reveal");
    const rec = recordRun();
    showOverlay(endSummary + rankLine(rec) + boardHTML(rec.board, rec.rank) + `<p class="small">${t.dataset.k === "give" ? "You gave the nine to Vane. They will be locked away with the rest, apart." : "You kept the nine. They hum, very faintly, when you sleep."} Year ${run.year + 1} will remember: <b>${LF.WORLDS[LF.worldFor(run.woken ? "woken" : "sealed", t.dataset.k)].name}</b>.</p>
      <button class="big btn-gold" data-act="newrun">New year</button>`);
  }
});
document.addEventListener("keydown", e => {
  if (!$("ov").hidden) { if (e.key === "Enter") { const b = $("card").querySelector(".btn-gold[data-act]"); if (b) b.click(); } return; }
  const G = g(); if (!G) return;
  const k = e.key;
  if (k === "Enter") { e.preventDefault(); submitWord(); }
  else if (k === " ") { e.preventDefault(); doPush(); }
  else if (k === "Backspace") { e.preventDefault(); sel.pop(); render(); }
  else if (k === "Escape") { sel = []; render(); }
  else if (/^[a-z]$/i.test(k) && G.phase === "spell") {
    const L = k.toLowerCase();
    const d = G.dice.find(d => d.state === "pool" && d.letter === L && !sel.includes(d.id)) || G.dice.find(d => d.state === "pool" && d.letter === "*" && !sel.includes(d.id));
    if (d) { sel.push(d.id); setMsg(""); render(); }
  }
});

try { await D3.init($("stage"), toggleDie); }
catch (err) { $("loading").textContent = "3D failed to load: " + err.message; throw err; }
$("loading").remove();
D3.setRollMode(rollMode);
let lastBand = "";
function updateBand() {
  const tut = g() && g().tutorial, br = $("band").getBoundingClientRect(), top = Math.round(br.top + 4), bottom = Math.round($("youPlate").getBoundingClientRect().top - 4 - (tut ? 78 : 0));   // the practice tip stays up, so the dice sit above it
  const k = top + ":" + bottom; if (k === lastBand) return; lastBand = k;
  D3.setBand(top, bottom);
}
window.addEventListener("resize", () => setTimeout(updateBand, 50));
$("card").addEventListener("click", () => setTimeout(autosave, 0));
$("ov").addEventListener("click", e => { if (sceneQueue && !e.target.closest("#card") && $("card").querySelector(".scene")) nextLine(); });   // tap anywhere advances the story   // after every choice
document.addEventListener("visibilitychange", () => { if (document.hidden) autosave(); });
window.addEventListener("pagehide", autosave);
newRun();
updateBand();
window.__lf = { get run() { return run; }, get g() { return g(); }, LF, D3, render, doPush, doSpell, doCast, toggleDie, showMap, enterRoom, afterFight };
